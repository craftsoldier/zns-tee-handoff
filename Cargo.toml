[package]
name = "zns-tee-handoff"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
anyhow = "1.0"
chacha20poly1305 = "=0.10.1"
hex = "0.4"
hkdf = "0.12"
p256 = { version = "0.13", default-features = false, features = ["arithmetic", "ecdh", "std"] }
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ureq = { version = "2", default-features = false, features = ["tls"] }
zeroize = "1.9"

[target.'cfg(target_os = "linux")'.dependencies]
sev = { version = "=8.0.0", default-features = false, features = ["snp", "crypto_nossl"] }
